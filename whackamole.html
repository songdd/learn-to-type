<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐭 打地鼠 · 字母大作战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #FFE8B5 0%, #FFD4A0 50%, #FFB882 100%);
            font-family: 'Comic Neue', 'Segoe UI', 'PingFang SC', 'Comic Sans MS', cursive, sans-serif;
            padding: 12px;
            cursor: default;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
        }

        .game-header {
            background: rgba(255, 248, 225, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 4px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 12px;
            border: 2px solid #FFB347;
            box-shadow: 0 3px 0 #E69500;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .game-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-shrink: 0;
        }
        .game-title h1 {
            font-size: 18px;
            color: #D45A1E;
            font-weight: bold;
            text-shadow: 1px 1px 0 #FFE0A3;
        }
        .level-badge {
            background: linear-gradient(135deg, #FF8C42, #FF6B35);
            border-radius: 30px;
            padding: 2px 12px;
            color: white;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 2px 0 #B85C1A;
            white-space: nowrap;
        }

        /* 最大连击样式 */
        .max-combo-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #4A2A00;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            margin-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .max-combo-badge span {
            font-size: 14px;
            font-weight: 800;
            color: #FF4757;
            background: white;
            padding: 0 8px;
            border-radius: 20px;
            margin-left: 4px;
        }

        .shortcut-tips {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 10px;
            border-radius: 25px;
            flex-shrink: 0;
        }
        .tip-item { display: flex; align-items: center; gap: 3px; }
        .tip-key {
            background: rgba(0, 0, 0, 0.35);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            font-size: 8px;
            color: #FFE0A3;
        }
        .tip-desc { color: rgba(255, 255, 255, 0.7); font-size: 8px; }

        .history-header-btn {
            background: linear-gradient(135deg, #4ECDC4, #2C8F8F);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 0 #1A6A6A;
            flex-shrink: 0;
        }
        .history-header-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #5DDFD5, #3DAF9F);
        }

        .game-layout {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .info-panel {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background: rgba(255, 248, 225, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 12px;
            border: 2px solid #FFB347;
            box-shadow: 0 2px 0 #E69500;
        }

        .card-title {
            font-size: 11px;
            font-weight: bold;
            color: #D45A1E;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            border-left: 3px solid #FF8C42;
            padding-left: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .stat-item {
            background: #FFB347;
            border-radius: 16px;
            padding: 4px;
            text-align: center;
            box-shadow: 0 1px 0 #E69500;
        }
        .stat-label { font-size: 8px; font-weight: bold; color: #FFF0D4; }
        .stat-value { font-size: 16px; font-weight: bold; color: white; text-shadow: 1px 1px 0 #E69500; }

        .skin-section {
            background: rgba(255, 248, 225, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 12px;
            border: 2px solid #FFB347;
            box-shadow: 0 2px 0 #E69500;
        }
        .skin-title {
            font-size: 11px;
            font-weight: bold;
            color: #D45A1E;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            border-left: 3px solid #FF8C42;
            padding-left: 8px;
        }
        .skin-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .skin-option {
            background: rgba(255, 220, 150, 0.8);
            border: 2px solid #FFB347;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .skin-option:hover { transform: scale(1.08); background: #FFD700; }
        .skin-option.active-skin {
            border-color: #FF4757;
            box-shadow: 0 0 0 2px #FFD700;
            transform: scale(1.05);
        }

        .btn-section {
            background: rgba(255, 248, 225, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 12px;
            border: 2px solid #FFB347;
            box-shadow: 0 2px 0 #E69500;
        }
        .btn-title {
            font-size: 11px;
            font-weight: bold;
            color: #D45A1E;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            border-left: 3px solid #FF8C42;
            padding-left: 8px;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .btn-row:last-child {
            margin-bottom: 0;
        }
        .btn {
            padding: 5px 8px;
            border: none;
            border-radius: 25px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            background: #FF9F4A;
            color: #4A2A00;
            box-shadow: 0 1px 0 #E69500;
            transition: 0.2s;
            font-family: inherit;
            flex: 1;
            text-align: center;
        }
        .btn-primary { background: #FF8C42; color: white; }
        .btn:hover { transform: translateY(-1px); background: #FFB366; }
        .btn-primary:hover { background: #FFA05E; }

        .game-area {
            flex: 1;
            background: linear-gradient(135deg, #6B8E23 0%, #556B2F 50%, #4A6A1A 100%);
            border-radius: 40px;
            padding: 16px;
            border: 3px solid #8B6914;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.2);
        }

        .grass-decoration {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: repeating-linear-gradient(90deg, 
                rgba(100, 140, 30, 0.5) 0px, 
                rgba(100, 140, 30, 0.5) 3px,
                transparent 3px,
                transparent 8px);
            pointer-events: none;
        }

        .holes-grid {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .hole {
            position: relative;
            width: 110px;
            height: 110px;
            background: radial-gradient(ellipse at 50% 0%, #5C3A1E, #3D2B1A);
            border-radius: 50%;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5), 0 5px 0 #2A1A0A;
            overflow: hidden;
            cursor: pointer;
        }

        .hole:nth-child(1) { transform: translateY(-6px); }
        .hole:nth-child(2) { transform: translateY(3px); }
        .hole:nth-child(3) { transform: translateY(-3px); }
        .hole:nth-child(4) { transform: translateY(8px); }
        .hole:nth-child(5) { transform: translateY(-8px); }
        .hole:nth-child(6) { transform: translateY(0px); }

        .hole::before { content: "🌿"; position: absolute; bottom: -6px; left: -10px; font-size: 18px; opacity: 0.6; pointer-events: none; }
        .hole::after { content: "🌱"; position: absolute; bottom: -4px; right: -8px; font-size: 16px; opacity: 0.5; pointer-events: none; }

        .mole-container {
            position: absolute;
            bottom: -10%;
            left: 0;
            right: 0;
            top: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transform: translateY(100%);
            transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .mole-container.active { display: flex; transform: translateY(0); }
        .mole-container.hide { transform: translateY(100%); transition: transform 0.15s ease-in; }
        .mole-container.hit { animation: hitAnimation 0.2s ease-out forwards; }

        @keyframes hitAnimation {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(8px) scale(0.8); filter: brightness(1.5); }
            100% { transform: translateY(100%) scale(0.5); opacity: 0; display: none; }
        }

        .mole-card {
            width: 85%;
            background: linear-gradient(145deg, #C49A6C, #A67B5B);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            box-shadow: 0 5px 0 #5C3A1E;
            border: 2px solid #8B5E3C;
            position: relative;
        }
        .mole-letter-sign {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFF8E7;
            border-radius: 16px;
            padding: 2px 10px;
            border: 2px solid #FFD700;
            box-shadow: 0 2px 0 #D4A76A;
            white-space: nowrap;
        }
        .mole-letter-sign span {
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            color: #FF4757;
        }
        .mole-emoji {
            font-size: 44px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            margin-top: 8px;
        }

        .flying-hammer {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 1000;
            font-size: 40px;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transition: none;
        }

        .floating-score {
            position: fixed;
            font-size: 22px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 0 #FF6B35;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 0.5s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .game-card {
            background: linear-gradient(145deg, #FFF8F0, #FFEFD5);
            border-radius: 40px;
            padding: 20px 28px;
            text-align: center;
            border: 3px solid #FFB347;
            animation: bounceIn 0.3s ease;
        }
        .game-card h2 { font-size: 22px; color: #FF8C42; margin-bottom: 10px; }
        .game-card .final-score { font-size: 38px; font-weight: bold; color: #FF4757; margin: 10px 0; }
        .game-card .auto-tip { font-size: 11px; color: #FF8C42; margin: 8px 0; }
        .game-card button {
            background: linear-gradient(135deg, #FF8C42, #FF6B35);
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 40px;
            z-index: 20;
            pointer-events: none;
        }
        .pause-text {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid #FFB347;
        }

        .history-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .history-card {
            background: linear-gradient(145deg, #FFF8F0, #FFEFD5);
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            overflow: hidden;
            border: 2px solid #FFB347;
        }
        .history-header {
            background: linear-gradient(135deg, #FF8C42, #FF6B35);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .history-header h3 { font-size: 15px; }
        .history-close {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 16px;
            cursor: pointer;
            color: white;
        }
        .history-content { padding: 12px; max-height: 60vh; overflow-y: auto; }
        .history-stats {
            background: #FFF0E0;
            border-radius: 14px;
            margin-bottom: 12px;
            padding: 10px;
        }
        .history-summary { display: flex; justify-content: space-around; text-align: center; gap: 8px; }
        .summary-item {
            background: white;
            border-radius: 10px;
            padding: 6px;
            flex: 1;
        }
        .summary-label { font-size: 9px; color: #8B6914; }
        .summary-value { font-size: 18px; font-weight: bold; color: #FF6B35; }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }
        .history-table th, .history-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid #FFD699;
        }
        .history-table th { background: #FFE0A3; color: #4A2A00; }
        .best-row { background: #FFF0C0; font-weight: bold; }
        .clear-history-btn {
            background: #E74C3C;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        @media (max-width: 800px) {
            .info-panel { width: 200px; }
            .hole { width: 90px; height: 90px; }
            .mole-emoji { font-size: 36px; }
            .mole-letter-sign span { font-size: 14px; }
            .mole-letter-sign { top: -16px; padding: 1px 8px; }
            .max-combo-badge { font-size: 9px; padding: 1px 8px; }
            .max-combo-badge span { font-size: 12px; padding: 0 5px; }
        }
        @media (max-width: 650px) {
            .game-layout { flex-direction: column; }
            .info-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .info-panel .card { flex: 1; min-width: 140px; }
            .skin-section { flex: 1; }
            .btn-section { flex: 1; }
            .hole { width: 80px; height: 80px; }
            .holes-grid { gap: 10px; }
            .mole-emoji { font-size: 30px; }
            .mole-letter-sign span { font-size: 12px; }
            .game-title h1 { font-size: 14px; }
            .level-badge { font-size: 9px; }
            .max-combo-badge { font-size: 8px; padding: 1px 6px; }
            .max-combo-badge span { font-size: 10px; }
        }
        @media (max-width: 480px) {
            .hole { width: 65px; height: 65px; }
            .hole::before, .hole::after { display: none; }
            .mole-emoji { font-size: 24px; }
            .mole-letter-sign span { font-size: 10px; }
            .mole-letter-sign { top: -14px; padding: 1px 5px; }
            .skin-option { width: 38px; height: 38px; font-size: 20px; }
            .max-combo-badge { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="game-header">
        <div class="game-title">
            <h1>🐭 打地鼠</h1>
            <span class="level-badge" id="headerLevelBadge">第1关</span>
            <div class="max-combo-badge">
                🏆 最大连击: <span id="maxComboValue">0</span>
            </div>
        </div>
        <div class="shortcut-tips">
            <div class="tip-item"><span class="tip-key">␣空格</span><span class="tip-desc">暂停</span></div>
            <div class="tip-item"><span class="tip-key">🖱️双击</span><span class="tip-desc">全屏</span></div>
            <div class="tip-item"><span class="tip-key">Alt↵Enter</span><span class="tip-desc">全屏</span></div>
        </div>
        <button class="history-header-btn" id="historyHeaderBtn">📜 历史记录</button>
    </div>

    <div class="game-layout">
        <div class="info-panel">
            <div class="card">
                <div class="card-title">📊 游戏数据</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-label">得分</div><div class="stat-value" id="scoreValue">0</div></div>
                    <div class="stat-item"><div class="stat-label">连击</div><div class="stat-value" id="comboValue">0</div></div>
                    <div class="stat-item"><div class="stat-label">关卡</div><div class="stat-value" id="levelNum">1/1</div></div>
                    <div class="stat-item"><div class="stat-label">剩余</div><div class="stat-value" id="remainValue">30/30</div></div>
                </div>
            </div>

            <div class="skin-section">
                <div class="skin-title">🎨 换皮肤</div>
                <div class="skin-selector" id="skinSelector">
                    <div class="skin-option" data-skin="🐭">🐭</div>
                    <div class="skin-option" data-skin="🐹">🐹</div>
                    <div class="skin-option" data-skin="🐰">🐰</div>
                    <div class="skin-option" data-skin="🐱">🐱</div>
                    <div class="skin-option" data-skin="🦊">🦊</div>
                </div>
            </div>

            <div class="btn-section">
                <div class="btn-title">🎮 游戏控制</div>
                <div class="btn-row">
                    <button class="btn" id="prevLevelBtn">◀ 上一关</button>
                    <button class="btn" id="backBtn">🏠 返回</button>
                    <button class="btn btn-primary" id="nextLevelBtn">下一关 ▶</button>
                </div>
                <div class="btn-row">
                    <button class="btn" id="resetBtn">🔄 重玩本关</button>
                </div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="holes-grid" id="holesGrid"></div>
            <div class="grass-decoration"></div>
        </div>
    </div>
</div>

<script>
// ==================== 登录验证 ====================
(function() {
    const loggedIn = localStorage.getItem('logged_in');
    const userName = localStorage.getItem('user_name');
    const urlParams = new URLSearchParams(window.location.search);
    const isDebug = urlParams.get('debug') === '1';
    if (!isDebug && (!loggedIn || !userName)) {
        window.location.href = 'login.html';
        return;
    }
})();

// ==================== 音效系统 ====================
(function() {
    let audioCtx = null;
    let hitBuffer = null;
    let missBuffer = null;
    
    function initAudio() {
        if (audioCtx) return audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            generateSounds();
            audioCtx.resume();
        } catch(e) {
            console.log("Web Audio API 不支持");
        }
        return audioCtx;
    }
    
    function generateSounds() {
        if (!audioCtx) return;
        try {
            const sampleRate = audioCtx.sampleRate;
            
            // 打中音效
            hitBuffer = audioCtx.createBuffer(1, sampleRate * 0.25, sampleRate);
            const hitData = hitBuffer.getChannelData(0);
            for (let i = 0; i < sampleRate * 0.25; i++) {
                const t = i / sampleRate;
                let sample = Math.sin(2 * Math.PI * (800 - t * 600) * t) * Math.exp(-t * 12);
                sample += (Math.random() * 2 - 1) * 0.3 * Math.exp(-t * 25);
                sample += Math.sin(2 * Math.PI * 120 * t) * Math.exp(-t * 8) * 0.3;
                hitData[i] = Math.max(-0.6, Math.min(0.6, sample));
            }
            
            // 未打中音效
            missBuffer = audioCtx.createBuffer(1, sampleRate * 0.2, sampleRate);
            const missData = missBuffer.getChannelData(0);
            for (let i = 0; i < sampleRate * 0.2; i++) {
                const t = i / sampleRate;
                let sample = Math.sin(2 * Math.PI * (300 - t * 200) * t) * Math.exp(-t * 15);
                sample += (Math.random() * 2 - 1) * 0.2 * Math.exp(-t * 20);
                missData[i] = Math.max(-0.4, Math.min(0.4, sample));
            }
        } catch(e) {
            console.log("生成音效失败:", e);
        }
    }
    
    function playHit() {
        if (!audioCtx || !hitBuffer) return;
        if (audioCtx.state !== 'running') {
            audioCtx.resume();
            return;
        }
        try {
            const source = audioCtx.createBufferSource();
            source.buffer = hitBuffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.35;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        } catch(e) {}
    }
    
    function playMiss() {
        if (!audioCtx || !missBuffer) return;
        if (audioCtx.state !== 'running') {
            audioCtx.resume();
            return;
        }
        try {
            const source = audioCtx.createBufferSource();
            source.buffer = missBuffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.3;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        } catch(e) {}
    }
    
    function enableAudio() {
        initAudio();
        document.removeEventListener('click', enableAudio);
        document.removeEventListener('keydown', enableAudio);
    }
    document.addEventListener('click', enableAudio);
    document.addEventListener('keydown', enableAudio);
    
    window._whackSound = { hit: playHit, miss: playMiss, init: initAudio };
})();

// ==================== 加载关卡配置 ====================
const CONFIG_PATH = './config.json';
let whackLevels = [];
let currentLevelIndex = 0;
let currentLevelConfig = null;
let currentGameLevel = 1;
let currentCharSet = null;
let currentVisibleTime = 6000;
let currentMaxConcurrent = 1;
let currentSpawnInterval = 1800;
let levelStartTime = null;
let autoNextTimer = null;
let isPaused = false;
let pauseOverlay = null;

async function loadWhackLevels() {
    try {
        const res = await fetch(CONFIG_PATH, { cache: 'no-cache' });
        const data = await res.json();
        const groups = data['learn-to-type'] || [];
        const whackGroup = groups.find(g => g.code === 'whackamole');
        if (whackGroup && whackGroup.levels) {
            whackLevels = whackGroup.levels;
            console.log("✅ 加载打地鼠关卡配置，共 " + whackLevels.length + " 关");
            return true;
        }
        return false;
    } catch(e) {
        console.error("加载配置失败:", e);
        return false;
    }
}

function getLevelById(levelId) {
    return whackLevels.find(level => level.id === levelId);
}

function getLevelIndexById(levelId) {
    return whackLevels.findIndex(level => level.id === levelId);
}

function parseKeysParam(keysStr) {
    if (!keysStr || keysStr === '') return null;
    try {
        const decoded = decodeURIComponent(keysStr);
        const parsed = JSON.parse(decoded);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    } catch(e) {
        if (keysStr.includes(',')) return keysStr.split(',').map(s => s.trim());
        if (keysStr.length > 0) return keysStr.split('');
    }
    return null;
}

function calculateVisibleTime(rate) {
    if (!rate || isNaN(rate)) return 6000;
    let time = 6000 - ((rate - 90) / 4) * 200;
    return Math.max(600, Math.min(6000, Math.round(time)));
}

function getRateByLevel(levelId) {
    return Math.min(200, 90 + (levelId - 1) * 2);
}

function updateDifficultyByConfig() {
    let effectiveRate = null;
    if (urlRate && !isNaN(urlRate)) effectiveRate = urlRate;
    else if (currentLevelConfig && currentLevelConfig.rate) effectiveRate = currentLevelConfig.rate;
    else effectiveRate = getRateByLevel(currentGameLevel);
    
    currentVisibleTime = calculateVisibleTime(effectiveRate);
    
    let effectiveNum = urlNum || (currentLevelConfig?.num || 30);
    if (effectiveNum >= 90) {
        currentMaxConcurrent = 3;
        currentSpawnInterval = Math.max(500, 1500 - Math.floor(effectiveNum / 10) * 30);
    } else if (effectiveNum >= 60) {
        currentMaxConcurrent = 2;
        currentSpawnInterval = Math.max(600, 1800 - Math.floor(effectiveNum / 10) * 40);
    } else {
        currentMaxConcurrent = 1;
        currentSpawnInterval = Math.max(700, 2000 - Math.floor(effectiveNum / 5) * 50);
    }
    return effectiveRate;
}

// ==================== 历史记录 ====================
const HISTORY_KEY = 'whackamole_history';

function getHistory() {
    const saved = localStorage.getItem(HISTORY_KEY);
    if (saved) try { return JSON.parse(saved); } catch(e) {}
    return {};
}

function saveLevelRecord(levelId, scoreVal, maxComboVal, timeSeconds) {
    const history = getHistory();
    const levelKey = String(levelId);
    const level = getLevelById(levelId);
    const description = level ? level.description : `第${levelId}关`;
    const newRecord = {
        id: levelId, description: description, score: scoreVal, maxCombo: maxComboVal,
        time: timeSeconds, date: new Date().toISOString(), formattedDate: new Date().toLocaleString()
    };
    let isNewRecord = false;
    if (history[levelKey]) {
        if (scoreVal > history[levelKey].score) {
            history[levelKey] = newRecord;
            isNewRecord = true;
        }
    } else {
        history[levelKey] = newRecord;
        isNewRecord = true;
    }
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    return isNewRecord;
}

function getTotalStats() {
    const history = getHistory();
    let totalScore = 0, completedCount = 0, bestCombo = 0;
    for (const key in history) {
        const record = history[key];
        totalScore += record.score;
        completedCount++;
        if (record.maxCombo > bestCombo) bestCombo = record.maxCombo;
    }
    return { totalScore, completedCount, bestCombo };
}

function showHistoryModal() {
    const history = getHistory();
    const { totalScore, completedCount, bestCombo } = getTotalStats();
    const records = Object.values(history).sort((a, b) => a.id - b.id);
    let tableRows = '', bestRowId = '', bestScore = 0;
    records.forEach(r => { if (r.score > bestScore) { bestScore = r.score; bestRowId = r.id; } });
    records.forEach(r => {
        tableRows += `<tr class="${r.id === bestRowId ? 'best-row' : ''}">`;
        tableRows += `<td>${r.id}</td><td style="max-width:80px; overflow:hidden;">${r.description.substring(0, 10)}...</td>`;
        tableRows += `<td style="color:#FF6B35;">${r.score}</td><td style="color:#2D6A2D;">${r.maxCombo}</td><td style="font-size:9px;">${r.time}秒</td>`;
        tableRows += `<tr>`;
    });
    const modal = document.createElement('div');
    modal.className = 'history-modal';
    modal.innerHTML = `
        <div class="history-card">
            <div class="history-header"><h3>📊 通关战绩</h3><button class="history-close">✕</button></div>
            <div class="history-content">
                <div class="history-stats"><div class="history-summary">
                    <div class="summary-item"><div class="summary-label">通关数</div><div class="summary-value">${completedCount}/${whackLevels.length}</div></div>
                    <div class="summary-item"><div class="summary-label">总分</div><div class="summary-value">${totalScore}</div></div>
                    <div class="summary-item"><div class="summary-label">最高连击</div><div class="summary-value">${bestCombo}</div></div>
                </div></div>
                <table class="history-table"><thead><tr><th>关卡</th><th>名称</th><th>得分</th><th>连击</th><th>用时</th><tr></thead>
                <tbody>${tableRows || '<tr><td colspan="5" class="no-data">暂无记录</td>'}</tbody>
            </table>
                <button class="clear-history-btn" id="clearHistoryBtn">🗑️ 清空所有记录</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('.history-close').addEventListener('click', () => modal.remove());
    modal.querySelector('#clearHistoryBtn').addEventListener('click', () => {
        if (confirm('清空所有记录？')) { localStorage.removeItem(HISTORY_KEY); modal.remove(); showFloatingScore('已清空', gameArea); }
    });
}

let gameActive = true;
let score = 0;
let combo = 0;

let totalTargets = 30;
let spawnInterval = null;
let hideTimeouts = [];
let holes = [];
let activeMoles = [];

// DOM 元素

const holesGrid = document.getElementById('holesGrid');
const scoreSpan = document.getElementById('scoreValue');
const comboSpan = document.getElementById('comboValue');

const maxComboSpan = document.getElementById('maxComboValue');

const nextLevelBtn = document.getElementById('nextLevelBtn');

function updateMaxComboDisplay() {

function getRandomLetter() {

function updateUI() {

function startTiming() { levelStartTime = Date.now(); }

// ==================== 暂停功能 ====================
function pauseGame() {
    isPaused = true;
    for (const item of hideTimeouts) {
        clearTimeout(item.timeout);
    }
    if (spawnInterval) clearInterval(spawnInterval);
    updatePauseOverlay();
}

function resumeGame() {
    isPaused = false;
    startSpawning();
    for (const hole of activeMoles) {
        const hideTimeout = setTimeout(() => {
            if (hole.isActive && gameActive && !isPaused) {
                hideMole(hole, false);
            }
        }, currentVisibleTime);
        hideTimeouts.push({ timeout: hideTimeout, hole: hole });
    }
    updatePauseOverlay();
}

function togglePause() {
    if (!gameActive) return;
    if (isPaused) {
        resumeGame();
    } else {
        pauseGame();
    }
    showFloatingScore(isPaused ? '⏸ 已暂停' : '▶ 继续', gameArea, '#FFD700');
}

function updatePauseOverlay() {
    if (isPaused && gameActive) {
        if (!pauseOverlay) {
            pauseOverlay = document.createElement('div');
            pauseOverlay.className = 'pause-overlay';
            pauseOverlay.innerHTML = '<div class="pause-text">⏸ 暂停中<br><span style="font-size:12px;">按空格继续</span></div>';
            gameArea.appendChild(pauseOverlay);
        }
    } else {
        if (pauseOverlay && pauseOverlay.parentNode) {
            pauseOverlay.remove();
            pauseOverlay = null;
        }
    }
}

// ==================== 全屏功能 ====================
function toggleFullscreen() {
    const area = document.querySelector('.game-area');

        area.requestFullscreen().catch(e => console.log('全屏失败:', e));

}

// ==================== 切换关卡 ====================
function switchToLevel(levelConfig) {
    if (!levelConfig) return;
    if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
    
    gameActive = false;
    isPaused = false;
    updatePauseOverlay();
    if (spawnInterval) clearInterval(spawnInterval);
    for (const item of hideTimeouts) clearTimeout(item.timeout);
    for (const hole of holes) if (hole.isActive) hideMole(hole, false);
    hideTimeouts = [];
    activeMoles = [];
    
    currentLevelConfig = levelConfig;
    currentGameLevel = levelConfig.id;
    currentCharSet = levelConfig.keys || null;
    totalTargets = levelConfig.num || 30;
    urlRate = levelConfig.rate || null;
    
    score = 0;
    combo = 0;
    maxCombo = 0;
    remainingTargets = totalTargets;
    gameActive = true;
    
    updateLetterSet();
    updateDifficultyByConfig();
    updateUI();
    
    const url = new URL(window.location.href);
    url.searchParams.set('id', currentGameLevel);
    if (currentCharSet) url.searchParams.set('keys', JSON.stringify(currentCharSet));
    if (totalTargets) url.searchParams.set('num', totalTargets);
    if (urlRate) url.searchParams.set('rate', urlRate);
    window.history.replaceState({}, '', url);
    
    startTiming();
    startSpawning();
    setTimeout(() => {
        if (gameActive && !isPaused && holes.filter(h => !h.isActive).length > 0) {
            showMole(holes[Math.floor(Math.random() * holes.length)], getRandomLetter());
        }
    }, 500);

function goPrevLevel() {
    if (currentLevelIndex > 0) {
        currentLevelIndex--;
        switchToLevel(whackLevels[currentLevelIndex]);
    } else {
        showFloatingScore('已经是第一关了！', gameArea, '#FFA500');
    }
}

function goNextLevel() {
    if (currentLevelIndex < whackLevels.length - 1) {
        currentLevelIndex++;
        switchToLevel(whackLevels[currentLevelIndex]);
    } else {
        showFloatingScore('恭喜！已是最后一关！', gameArea, '#FFD700');
    }
}

// ==================== 飞锤特效 ====================
function createFlyingHammer(fromX, fromY, toX, toY, onComplete) {
    const gameAreaRect = gameArea.getBoundingClientRect();
    const relFromX = fromX - gameAreaRect.left;
    const relFromY = fromY - gameAreaRect.top;
    const relToX = toX - gameAreaRect.left;
    const relToY = toY - gameAreaRect.top;
    
    const hammer = document.createElement('div');
    hammer.className = 'flying-hammer';
    hammer.textContent = '🔨';
    hammer.style.left = relFromX + 'px';
    hammer.style.top = relFromY + 'px';
    gameArea.appendChild(hammer);
    
    const startX = relFromX, startY = relFromY, endX = relToX, endY = relToY;
    const duration = 200;
    const startTime = performance.now();
    
    function animateHammer(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const easeOut = 1 - Math.pow(1 - t, 2);
        const currentX = startX + (endX - startX) * easeOut;
        const currentY = startY + (endY - startY) * easeOut;
        
        hammer.style.left = currentX + 'px';
        hammer.style.top = currentY + 'px';
        hammer.style.transform = `translate(-50%, -50%) rotate(${t * 360}deg)`;
        
        if (t < 1) {
            requestAnimationFrame(animateHammer);
        } else {
            hammer.style.transform = 'translate(-50%, -50%) rotate(-30deg) scale(0.8)';
            setTimeout(() => { hammer.remove(); if (onComplete) onComplete(); }, 50);
        }
    }
    requestAnimationFrame(animateHammer);
}

function showFloatingScore(text, element, color = '#FFD700') {
    const rect = element.getBoundingClientRect();
    const floatingDiv = document.createElement('div');
    floatingDiv.className = 'floating-score';
    floatingDiv.textContent = text;
    floatingDiv.style.color = color;
    floatingDiv.style.left = (rect.left + rect.width / 2 - 15) + 'px';
    floatingDiv.style.top = (rect.top - 15) + 'px';
    document.body.appendChild(floatingDiv);
    setTimeout(() => floatingDiv.remove(), 500);
}

function hitMole(hole, letter) {
    if (!gameActive || isPaused) return false;
    if (!hole.isActive || hole.currentLetter !== letter) return false;
    
    // 播放打中音效
    if (window._whackSound) {
        window._whackSound.init();
        window._whackSound.hit();
    }
    
    let addScore = 10;
    combo++;
    if (combo > maxCombo) {
        maxCombo = combo;
        updateMaxComboDisplay();
    }
    if (combo >= 5) addScore = 15;
    if (combo >= 10) addScore = 25;
    if (combo >= 20) addScore = 40;
    
    score += addScore;
    remainingTargets--;
    updateUI();
    
    showFloatingScore(`+${addScore}`, hole.element, '#FFD700');
    hideMole(hole, true);
    
    if (remainingTargets <= 0) endGame(true);
    return true;
}

function getTargetAbsolutePosition(element) {
    const rect = element.getBoundingClientRect();
    return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
    };
}

function getHammerStartAbsolutePosition() {
    const gameAreaRect = gameArea.getBoundingClientRect();
    return {
        x: gameAreaRect.left + gameAreaRect.width / 2,
        y: gameAreaRect.top - 10
    };
}

// ==================== 键盘打击 ====================
function onKeyPress(e) {
    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        togglePause();
        return;
    }
    if (!gameActive || isPaused) return;
    
    let key = e.key;
    const symbolMap = { ';':';', ':':';', ',':',', '<':',', '.':'.', '>':'.', '/':'/', '?':'/' };
    let matchChar = symbolMap[key] || (key.length === 1 && /[a-zA-Z]/.test(key) ? key.toUpperCase() : null);
    if (!matchChar) return;
    
    const targetMole = activeMoles.find(m => m.currentLetter === matchChar);
    if (targetMole) {
        const targetPos = getTargetAbsolutePosition(targetMole.element);
        const startPos = getHammerStartAbsolutePosition();
        createFlyingHammer(startPos.x, startPos.y, targetPos.x, targetPos.y, () => {
            hitMole(targetMole, matchChar);
        });
    } else {
        // 未打中，播放未打中音效
        if (window._whackSound) {
            window._whackSound.init();
            window._whackSound.miss();
        }
        if (combo > 0) {
            combo = 0;
            updateUI();
            showFloatingScore('Miss', gameArea, '#FF6B6B');
        }
    }
}

// ==================== 地鼠管理 ====================
function createHoles() {
    holesGrid.innerHTML = '';
    holes = [];
    for (let i = 0; i < HOLE_COUNT; i++) {
        const holeDiv = document.createElement('div');
        holeDiv.className = 'hole';
        const moleContainer = document.createElement('div');
        moleContainer.className = 'mole-container';
        moleContainer.style.display = 'none';
        moleContainer.innerHTML = getMoleHTML('A', currentSkin);
        holeDiv.appendChild(moleContainer);
        holesGrid.appendChild(holeDiv);
        holes.push({ element: holeDiv, moleContainer, isActive: false, currentLetter: '' });
    }
}

function showMole(hole, letter) {
    if (!gameActive || isPaused || hole.isActive) return;
    hole.isActive = true;
    hole.currentLetter = letter;
    hole.moleContainer.innerHTML = getMoleHTML(letter, currentSkin);
    hole.moleContainer.classList.remove('hide', 'hit', 'active');
    hole.moleContainer.style.display = 'flex';
    setTimeout(() => hole.moleContainer.classList.add('active'), 10);
    
    const hideTimeout = setTimeout(() => {
        if (hole.isActive && gameActive && !isPaused) {
            hideMole(hole, false);
        }
    }, currentVisibleTime);
    hideTimeouts.push({ timeout: hideTimeout, hole: hole });
    activeMoles.push(hole);
}

function hideMole(hole, wasHit = false) {
    if (!hole.isActive) return;
    hole.isActive = false;
    if (wasHit) {
        hole.moleContainer.classList.add('hit');
    } else {
        hole.moleContainer.classList.add('hide');
    }
    hole.moleContainer.classList.remove('active');
    setTimeout(() => {
        if (hole.moleContainer) {
            hole.moleContainer.classList.remove('hide', 'hit');
            hole.moleContainer.style.display = 'none';
            hole.moleContainer.innerHTML = getMoleHTML('A', currentSkin);
        }
    }, 200);
    
    activeMoles = activeMoles.filter(m => m !== hole);
    hideTimeouts = hideTimeouts.filter(item => {
        if (item.hole === hole) { clearTimeout(item.timeout); return false; }
        return true;
    });
}

// ==================== 游戏循环 ====================
function startSpawning() {
    if (spawnInterval) clearInterval(spawnInterval);
    spawnInterval = setInterval(() => {
        if (!gameActive || isPaused) return;
        const inactiveHoles = holes.filter(h => !h.isActive);
        if (inactiveHoles.length > 0 && activeMoles.length < currentMaxConcurrent) {
            const randomHole = inactiveHoles[Math.floor(Math.random() * inactiveHoles.length)];
            showMole(randomHole, getRandomLetter());
        }
    }, currentSpawnInterval);
}

function endGame(isComplete = false) {
    if (!gameActive) return;
    gameActive = false;
    isPaused = false;
    updatePauseOverlay();
    if (spawnInterval) clearInterval(spawnInterval);
    for (const hole of holes) if (hole.isActive) hideMole(hole, false);
    for (const item of hideTimeouts) clearTimeout(item.timeout);
    endTimingAndSave();
    
    const overlay = document.createElement('div');
    overlay.className = 'game-overlay';
    const hasNext = currentLevelIndex < whackLevels.length - 1;
    overlay.innerHTML = `
        <div class="game-card">
            <h2>🎉 通关成功！ 🎉</h2>
            <div class="final-score">${score}</div>
            <p>🔥 最高连击: ${maxCombo}</p>
            <p>📋 本关目标: ${totalTargets}</p>
            ${hasNext ? '<div class="auto-tip" id="countdownTip">⏰ <span id="countdownNumber">5</span> 秒后自动进入下一关 ⏰</div>' : '<div class="auto-tip">🎊 恭喜完成所有关卡！ 🎊</div>'}
            <div>
                <button id="restartBtnOverlay">🔄 再玩一次</button>
                ${hasNext ? '<button id="nextLevelBtnOverlay">➡️ 下一关</button>' : ''}
                <button id="backBtnOverlay">🏠 返回首页</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
    
    document.getElementById('restartBtnOverlay').addEventListener('click', () => {
        if (autoNextTimer) clearTimeout(autoNextTimer);
        overlay.remove();
        resetGame();
    });
    if (hasNext) {
        document.getElementById('nextLevelBtnOverlay').addEventListener('click', () => {
            if (autoNextTimer) clearTimeout(autoNextTimer);
            overlay.remove();
            goNextLevel();
        });
        let countdown = 5;
        const countdownSpan = overlay.querySelector('#countdownNumber');
        autoNextTimer = setInterval(() => {
            countdown--;
            if (countdownSpan) countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(autoNextTimer);
                overlay.remove();
                goNextLevel();
            }
        }, 1000);
    }
    document.getElementById('backBtnOverlay').addEventListener('click', () => {
        if (autoNextTimer) clearTimeout(autoNextTimer);
        window.location.href = 'index.html';
    });
}

function resetGame() {
    if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
    gameActive = true;
    isPaused = false;
    updatePauseOverlay();
    score = 0;
    combo = 0;
    maxCombo = 0;
    remainingTargets = totalTargets;
    updateUI();
    for (const hole of holes) if (hole.isActive) hideMole(hole, false);
    if (spawnInterval) clearInterval(spawnInterval);
    for (const item of hideTimeouts) clearTimeout(item.timeout);
    hideTimeouts = [];
    activeMoles = [];
    levelStartTime = Date.now();
    startSpawning();
    setTimeout(() => {
        if (gameActive && !isPaused && holes.filter(h => !h.isActive).length > 0) {
            showMole(holes[Math.floor(Math.random() * holes.length)], getRandomLetter());
        }
    }, 500);
}

// ==================== 初始化皮肤选择器 ====================
function initSkinSelector() {
    const selector = document.getElementById('skinSelector');
    if (!selector) return;
    document.querySelectorAll('.skin-option').forEach(opt => {
        const skinValue = opt.dataset.skin;
        if (skinValue === currentSkin) opt.classList.add('active-skin');
        opt.addEventListener('click', () => {
            currentSkin = skinValue;
            localStorage.setItem(SKIN_KEY, currentSkin);
            document.querySelectorAll('.skin-option').forEach(o => o.classList.remove('active-skin'));
            opt.classList.add('active-skin');
            for (const hole of holes) {
                if (hole.isActive) {
                    hole.moleContainer.innerHTML = getMoleHTML(hole.currentLetter, currentSkin);
                }
            }
            showFloatingScore(`换成 ${currentSkin}`, gameArea, '#FFD700');
        });
    });
}

// ==================== 初始化 ====================
async function initGame() {
    await loadWhackLevels();
    createHoles();
    initSkinSelector();
    
    let startConfig = null;
    if (initialLevelId && !isNaN(initialLevelId)) startConfig = getLevelById(initialLevelId);
    if (!startConfig && urlKeysParam) {
        let targetKeys = parseKeysParam(urlKeysParam);
        if (targetKeys && targetKeys.length > 0) {
            for (const level of whackLevels) {
                if (level.keys && level.keys.length === targetKeys.length && level.keys.every((k, i) => k === targetKeys[i])) {
                    startConfig = level;
                    break;
                }
            }
        }
    }
    if (!startConfig && whackLevels.length > 0) startConfig = whackLevels[0];
    
    if (startConfig) {
        currentLevelIndex = getLevelIndexById(startConfig.id);
        currentLevelConfig = startConfig;
        currentGameLevel = startConfig.id;
        currentCharSet = startConfig.keys || null;
        totalTargets = startConfig.num || 30;
        urlRate = startConfig.rate || null;
        remainingTargets = totalTargets;
        updateLetterSet();
        updateDifficultyByConfig();
        updateUI();
    }
    
    window.addEventListener('keydown', onKeyPress);
    prevLevelBtn?.addEventListener('click', goPrevLevel);
    nextLevelBtn?.addEventListener('click', goNextLevel);
    resetBtn?.addEventListener('click', resetGame);
    backBtn?.addEventListener('click', () => window.location.href = 'index.html');
    historyHeaderBtn?.addEventListener('click', showHistoryModal);
    
    gameArea.addEventListener('dblclick', toggleFullscreen);
    document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'Enter') { e.preventDefault(); toggleFullscreen(); } });
    
    startTiming();
    startSpawning();
    setTimeout(() => {
        if (gameActive && !isPaused && holes.filter(h => !h.isActive).length > 0) {
            showMole(holes[Math.floor(Math.random() * holes.length)], getRandomLetter());
        }
    }, 500);
}

initGame();
</script>
