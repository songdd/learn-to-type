<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 - 奕霖打字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 56px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #fff, #8cc9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group label i {
            margin-right: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 48px;
            font-size: 16px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #ff0050;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(255, 0, 80, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0050, #ff6b35);
            border: none;
            border-radius: 48px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 80, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 24px;
            font-size: 13px;
            display: none;
        }

        .message.error {
            background: rgba(255, 0, 80, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 0, 80, 0.3);
        }

        .message.success {
            background: rgba(0, 255, 100, 0.15);
            color: #7cff9e;
            border: 1px solid rgba(0, 255, 100, 0.3);
        }

        /* ===== 二维码区域 ===== */
        .qr-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 24px;
            margin-top: 12px;
        }

        .qr-title {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .qr-title::before,
        .qr-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .qr-title span {
            padding: 0 14px;
            white-space: nowrap;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .qr-item {
            text-align: center;
            width: 160px;
        }

        .qr-code {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 20px;
            padding: 10px;
            margin: 0 auto 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .qr-code:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .qr-code:active {
            transform: scale(0.95);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        /* 二维码上的放大提示 */
        .qr-code .zoom-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .qr-code:hover .zoom-hint {
            opacity: 1;
        }

        .qr-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
            margin-top: 2px;
        }

        .qr-label .icon {
            font-size: 16px;
        }

        .qr-tip {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 18px;
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== ★★★ 全屏大图预览遮罩 ★★★ ===== */
        .image-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            animation: fadeInOverlay 0.3s ease forwards;
            cursor: pointer;
            padding: 40px;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-preview-overlay .preview-content {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: zoomIn 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
            transform: scale(0.8);
        }

        @keyframes zoomIn {
            from { 
                transform: scale(0.8);
                opacity: 0;
            }
            to { 
                transform: scale(1);
                opacity: 1;
            }
        }

        .image-preview-overlay .preview-image {
            max-width: 70vw;
            max-height: 70vh;
            width: auto;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            background: white;
            padding: 16px;
            object-fit: contain;
        }

        .image-preview-overlay .preview-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .image-preview-overlay .preview-close-hint {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            margin-top: 4px;
        }

        .image-preview-overlay .preview-close-hint kbd {
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px;
            }
            
            .qr-container {
                gap: 24px;
            }
            
            .qr-item {
                width: 130px;
            }
            
            .qr-code {
                width: 110px;
                height: 110px;
                padding: 8px;
            }
            
            .qr-label {
                font-size: 12px;
            }
            
            .qr-title {
                font-size: 12px;
            }

            .image-preview-overlay .preview-image {
                max-width: 85vw;
                max-height: 65vh;
                padding: 10px;
            }

            .image-preview-overlay .preview-label {
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {
            .qr-container {
                gap: 16px;
            }
            
            .qr-item {
                width: 110px;
            }
            
            .qr-code {
                width: 90px;
                height: 90px;
                padding: 6px;
            }
            
            .qr-label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">✈️🎮</div>
    <h1>奕霖打字</h1>
    <div class="subtitle">邀请制 · 专属入口</div>

    <div class="input-group">
        <label><i>🔑</i> 邀请码</label>
        <input type="text" id="inviteCode" placeholder="请输入你的邀请码" autocomplete="off">
    </div>

    <button class="login-btn" id="loginBtn">
        <span>✨</span> 验证并进入游戏 <span>🚀</span>
    </button>

    <div id="message" class="message"></div>

    <!-- 二维码区域 -->
    <div class="qr-section">
        <div class="qr-title">
            <span>📱 扫码添加好友 · 获取邀请码</span>
        </div>
        <div class="qr-container">
            <div class="qr-item">
                <div class="qr-code" data-platform="抖音" data-img="pic/抖音_二维码.jpg">
                    <img src="pic/抖音_二维码.jpg" alt="抖音二维码" 
                         onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;background:#1a1a2e;border-radius:12px;\'>🎵</div>'">
                    <span class="zoom-hint">🔍 点击放大</span>
                </div>
                <div class="qr-label">
                    <span class="icon">🎵</span> 抖音
                </div>
            </div>
            <div class="qr-item">
                <div class="qr-code" data-platform="微信" data-img="pic/微信_二维码.jpg">
                    <img src="pic/微信_二维码.jpg" alt="微信二维码" 
                         onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;background:#1a1a2e;border-radius:12px;\'>💬</div>'">
                    <span class="zoom-hint">🔍 点击放大</span>
                </div>
                <div class="qr-label">
                    <span class="icon">💬</span> 微信
                </div>
            </div>
        </div>
        <div class="qr-tip">
            💡 点击二维码可放大查看，扫码添加好友获取专属邀请码
        </div>
    </div>
</div>

<script>
    const loginBtn = document.getElementById('loginBtn');
    const inviteInput = document.getElementById('inviteCode');
    const messageDiv = document.getElementById('message');

    function showMessage(text, isError = true) {
        messageDiv.textContent = text;
        messageDiv.className = `message ${isError ? 'error' : 'success'}`;
        messageDiv.style.display = 'block';
        
        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 3000);
    }

    function setLoading(isLoading) {
        if (isLoading) {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> 验证中...';
        } else {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span>✨</span> 验证并进入游戏 <span>🚀</span>';
        }
    }

    async function verifyCode(code) {
        try {
            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ code: code })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const text = await response.text();
            if (!text || text.trim() === '') {
                return { success: false, message: '服务器返回空响应' };
            }
            
            try {
                return JSON.parse(text);
            } catch (e) {
                console.error('JSON 解析失败:', text);
                return { success: false, message: '服务器响应格式错误' };
            }
        } catch (e) {
            console.error('验证请求失败:', e);
            return { success: false, message: '网络错误，请检查网络后重试' };
        }
    }

    async function handleLogin() {
        const code = inviteInput.value.trim();
        
        if (!code) {
            showMessage('请输入邀请码', true);
            inviteInput.focus();
            return;
        }
        
        setLoading(true);
        
        const result = await verifyCode(code);
        
        if (result.success) {
            try {
                const logResponse = await fetch('/api/login-log', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_name: result.name,
                        invite_code: code,
                        ip_address: null,
                        user_agent: navigator.userAgent
                    })
                });
                
                if (logResponse.ok) {
                    const logText = await logResponse.text();
                    if (logText && logText.trim()) {
                        try {
                            JSON.parse(logText);
                        } catch (e) {
                            console.warn('登录日志响应不是有效 JSON，但不影响登录');
                        }
                    }
                } else {
                    console.warn('登录日志记录失败，状态码:', logResponse.status);
                }
            } catch (logError) {
                console.warn('登录日志记录异常:', logError);
            }
            
            showMessage(`✅ 欢迎 ${result.name}！正在进入游戏...`, false);
            
            localStorage.setItem('logged_in', 'true');
            localStorage.setItem('user_name', result.name);
            localStorage.setItem('login_code', code);
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        } else {
            showMessage(result.message || '验证失败，请重试', true);
            setLoading(false);
            inviteInput.focus();
        }
    }

    // ===== ★★★ 二维码大图预览功能 ★★★ =====
    function showImagePreview(imgSrc, platform) {
        // 移除已有的预览
        const existing = document.querySelector('.image-preview-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.className = 'image-preview-overlay';
        overlay.innerHTML = `
            <div class="preview-content">
                <img class="preview-image" src="${imgSrc}" alt="${platform}二维码" 
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div style="display:none;font-size:80px;color:rgba(255,255,255,0.3);">${platform === '抖音' ? '🎵' : '💬'}</div>
                <div class="preview-label">📱 ${platform} 二维码</div>
                <div class="preview-close-hint">点击任意位置关闭 · 按 <kbd>ESC</kbd> 关闭</div>
            </div>
        `;

        document.body.appendChild(overlay);

        // 点击关闭
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay || e.target.closest('.preview-content')) {
                closePreview();
            }
        });

        // ESC 键关闭
        function handleEsc(e) {
            if (e.key === 'Escape') {
                closePreview();
                document.removeEventListener('keydown', handleEsc);
            }
        }
        document.addEventListener('keydown', handleEsc);
    }

    function closePreview() {
        const overlay = document.querySelector('.image-preview-overlay');
        if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.remove();
            }, 300);
        }
    }

    // ===== 绑定二维码点击事件 =====
    function setupQrClick() {
        document.querySelectorAll('.qr-code').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const platform = this.dataset.platform || '二维码';
                const img = this.querySelector('img');
                const imgSrc = img ? img.src : '';
                
                // 如果图片加载失败（使用了 fallback），使用默认图片
                if (!imgSrc || imgSrc.includes('data:image/svg')) {
                    // 尝试从 data-img 属性获取
                    const dataImg = this.dataset.img;
                    if (dataImg) {
                        showImagePreview(dataImg, platform);
                    } else {
                        showMessage('📱 请查看 ' + platform + ' 二维码', false);
                    }
                } else {
                    showImagePreview(imgSrc, platform);
                }
            });
        });
    }

    // ===== 设置二维码提示 =====
    function setupQrHints() {
        const douyinQr = document.getElementById('douyinQr');
        const wechatQr = document.getElementById('wechatQr');
        
        // 保留原来的提示功能，但不再与点击冲突
        if (douyinQr) {
            douyinQr.addEventListener('mouseenter', () => {
                // 鼠标悬停时显示提示（由 CSS 的 .zoom-hint 处理）
            });
        }
        
        if (wechatQr) {
            wechatQr.addEventListener('mouseenter', () => {
                // 鼠标悬停时显示提示（由 CSS 的 .zoom-hint 处理）
            });
        }
    }

    // ===== 绑定事件 =====
    loginBtn.addEventListener('click', handleLogin);
    inviteInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    // ===== 从 URL 参数自动填充邀请码 =====
    const urlParams = new URLSearchParams(window.location.search);
    const codeFromUrl = urlParams.get('code') || urlParams.get('invite');
    if (codeFromUrl) {
        inviteInput.value = codeFromUrl;
    }
    
    // ===== 初始化 =====
    setupQrHints();
    setupQrClick();
    inviteInput.focus();
</script>
</body>
</html>
