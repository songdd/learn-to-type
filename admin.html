<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>管理后台 · 奕霖打字</title>
    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce6 50%, #c8d0dc 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 16px;
            color: #1a2332;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #1a2332, #4a6a8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-left .subtitle {
            font-size: 12px;
            color: rgba(26, 35, 50, 0.4);
            margin-left: 8px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-right .last-update {
            font-size: 11px;
            color: rgba(26, 35, 50, 0.35);
        }

        /* ========== 按钮 ========== */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e8456b, #ff6b35);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(232, 69, 107, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.7);
            color: #1a2332;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.15);
        }

        .btn-danger {
            background: rgba(232, 69, 107, 0.12);
            color: #e8456b;
            border: 1px solid rgba(232, 69, 107, 0.15);
        }
        .btn-danger:hover {
            background: rgba(232, 69, 107, 0.2);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }
        .btn-xs {
            padding: 2px 8px;
            font-size: 10px;
        }

        /* ========== 统计卡片 ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-card .number.orange { color: #e8456b; }
        .stat-card .number.green { color: #1a8a5a; }
        .stat-card .number.blue { color: #2a7ab0; }
        .stat-card .number.gold { color: #c9940a; }
        .stat-card .number.pink { color: #c94a7a; }
        .stat-card .number.purple { color: #7a5ab0; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(26, 35, 50, 0.5);
            margin-top: 4px;
        }

        .stat-card .trend {
            font-size: 10px;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .stat-card .trend.up {
            background: rgba(26, 138, 90, 0.12);
            color: #1a8a5a;
        }
        .stat-card .trend.down {
            background: rgba(232, 69, 107, 0.12);
            color: #e8456b;
        }

        /* ========== 双栏布局 ========== */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }

        /* ========== 卡片 ========== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 18px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ========== 表单 ========== */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 160px;
        }

        .form-group label {
            display: block;
            color: rgba(26, 35, 50, 0.5);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            font-size: 13px;
            color: #1a2332;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #e8456b;
            box-shadow: 0 0 0 3px rgba(232, 69, 107, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(26, 35, 50, 0.3);
        }

        /* ========== 预览 ========== */
        .preview-box {
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            padding: 10px 14px;
            display: none;
        }
        .preview-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .preview-box .code {
            font-family: monospace;
            font-size: 16px;
            color: #1a8a5a;
            font-weight: 600;
            word-break: break-all;
        }

        .preview-box .link {
            font-size: 11px;
            color: rgba(26, 35, 50, 0.35);
            margin-top: 4px;
            word-break: break-all;
        }

        /* ========== 趋势图 ========== */
        .trend-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 120px;
            padding-top: 10px;
            gap: 6px;
        }

        .trend-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .trend-bar {
            width: 100%;
            max-width: 40px;
            min-height: 4px;
            border-radius: 4px 4px 0 0;
            background: linear-gradient(180deg, #e8456b, #ff6b35);
            transition: height 0.5s ease;
            position: relative;
        }

        .trend-bar-label {
            font-size: 9px;
            color: rgba(26, 35, 50, 0.4);
            margin-top: 6px;
            text-align: center;
        }

        .trend-bar-label .count {
            color: #1a2332;
            font-weight: 600;
        }

        /* ========== 表格 ========== */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        th {
            color: rgba(26, 35, 50, 0.4);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            color: #1a2332;
            font-size: 12px;
        }

        .code-cell {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #1a2332;
        }

        /* ===== 状态标签 - 优化后更清晰 ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .status-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-used {
            background: rgba(232, 69, 107, 0.10);
            color: #c0395a;
        }
        .status-used .dot {
            background: #e8456b;
        }

        .status-unused {
            background: rgba(26, 138, 90, 0.10);
            color: #1a7a4a;
        }
        .status-unused .dot {
            background: #1a8a5a;
        }

        .action-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ========== 分页 ========== */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-size-select {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            padding: 4px 8px;
            color: #1a2332;
            font-size: 12px;
            cursor: pointer;
        }

        .page-info {
            color: rgba(26, 35, 50, 0.4);
            font-size: 12px;
        }

        .record-info {
            color: rgba(26, 35, 50, 0.3);
            font-size: 11px;
        }

        /* ========== 筛选栏 ========== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .filter-item {
            flex: 1;
            min-width: 130px;
        }

        .filter-item label {
            display: block;
            color: rgba(26, 35, 50, 0.4);
            font-size: 10px;
            margin-bottom: 3px;
        }

        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            font-size: 12px;
            color: #1a2332;
            outline: none;
        }

        .filter-item input:focus,
        .filter-item select:focus {
            border-color: #e8456b;
            box-shadow: 0 0 0 3px rgba(232, 69, 107, 0.08);
        }

        .filter-item input[type="date"] {
            padding: 5px 8px;
        }

        .filter-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(26, 35, 50, 0.3);
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state .text {
            font-size: 14px;
        }

        /* ========== Loading & Toast ========== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            border-top-color: #e8456b;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 1000;
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            background: rgba(232, 69, 107, 0.9);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-left .subtitle {
                display: none;
            }
            .header-right {
                justify-content: space-between;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-card {
                padding: 12px 12px;
            }
            .stat-card .number {
                font-size: 20px;
            }
            .two-col {
                gap: 12px;
            }
            .card {
                padding: 14px 14px;
            }
            .form-row {
                flex-direction: column;
            }
            .form-group {
                min-width: 100%;
            }
            .filter-bar {
                flex-direction: column;
            }
            .filter-item {
                min-width: 100%;
            }
            .pagination-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .pagination-controls {
                justify-content: center;
            }
            /* 状态标签在移动端保持清晰 */
            .status-badge {
                font-size: 10px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-card .number {
                font-size: 18px;
            }
            .stat-card .label {
                font-size: 10px;
            }
            table {
                font-size: 11px;
            }
            th,
            td {
                padding: 6px 4px;
            }
            .status-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            .status-badge .dot {
                width: 5px;
                height: 5px;
            }
        }

        /* ========== 动画 ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🔑</span>
                <h1>管理后台</h1>
                <span class="subtitle">邀请码 · 登录统计</span>
            </div>
            <div class="header-right">
                <span class="last-update" id="lastUpdateTime">最后更新: --</span>
                <button class="btn btn-secondary btn-sm" onclick="refreshAll()">🔄 刷新</button>
                <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📥 导出</button>
            </div>
        </header>

        <!-- ===== 统计卡片 ===== -->
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="number orange" id="statTotal">--</div>
                <div class="label">📌 总邀请码</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="statUsed">--</div>
                <div class="label">✅ 已使用</div>
            </div>
            <div class="stat-card">
                <div class="number blue" id="statUnused">--</div>
                <div class="label">📋 未使用</div>
            </div>
            <div class="stat-card">
                <div class="number gold" id="statTotalLogin">--</div>
                <div class="label">📊 总登录</div>
            </div>
            <div class="stat-card">
                <div class="number pink" id="statTodayLogin">--</div>
                <div class="label">📈 今日登录</div>
            </div>
        </section>

        <!-- ===== 双栏：生成邀请码 + 登录趋势 ===== -->
        <section class="two-col">
            <!-- 左：生成邀请码 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon">✨</span> 快速生成邀请码
                    </div>
                    <span style="font-size:11px; color:rgba(26,35,50,0.3);">好友邀请专用</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>👤 好友名称</label>
                        <input type="text" id="friendName" placeholder="例：张潇" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>📱 抖音号（可选）</label>
                        <input type="text" id="douyinId" placeholder="用于生成前缀" autocomplete="off">
                    </div>
                    <button class="btn btn-success" id="saveToDbBtn">💾 入库</button>
                </div>
                <div class="preview-box" id="previewBox">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                        <div>
                            <div style="font-size:11px; color:rgba(26,35,50,0.4);">📝 预览</div>
                            <div class="code" id="previewCode">--</div>
                            <div class="link" id="previewLink">--</div>
                        </div>
                        <button class="btn btn-secondary btn-xs" onclick="copyPreviewLink()">📋 复制链接</button>
                    </div>
                </div>
            </div>

            <!-- 右：登录趋势 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon">📊</span> 近7天登录趋势
                    </div>
                    <span style="font-size:11px; color:rgba(26,35,50,0.3);" id="trendSubtitle">加载中...</span>
                </div>
                <div class="trend-chart" id="trendChart">
                    <div style="width:100%; text-align:center; color:rgba(26,35,50,0.3); padding:30px 0; font-size:13px;">
                        暂无数据
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== 邀请码列表 ===== -->
        <div class="card" style="margin-bottom:20px;">
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">📋</span> 邀请码列表
                    <span style="font-size:11px; font-weight:400; color:rgba(26,35,50,0.3);" id="inviteCount">(0 条)</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-secondary btn-sm" onclick="refreshInvites()">🔄 刷新</button>
                </div>
            </div>

            <!-- 筛选 -->
            <div class="filter-bar">
                <div class="filter-item">
                    <label>👤 好友名称</label>
                    <input type="text" id="filterName" placeholder="搜索..." autocomplete="off">
                </div>
                <div class="filter-item">
                    <label>📋 状态</label>
                    <select id="filterStatus">
                        <option value="all">全部</option>
                        <option value="unused">未使用</option>
                        <option value="used">已使用</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary btn-sm" id="searchBtn">🔍 搜索</button>
                    <button class="btn btn-secondary btn-sm" id="clearFilterBtn">🗑️ 清空</button>
                </div>
            </div>

            <!-- 表格 -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:50px;">ID</th>
                            <th>好友</th>
                            <th>邀请码</th>
                            <th style="width:110px;">状态</th>
                            <th style="width:140px;">创建时间</th>
                            <th style="width:140px;">使用时间</th>
                            <th style="width:120px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="inviteTableBody">
                        <tr><td colspan="7" class="empty-state"><div class="icon">📭</div><div class="text">暂无数据</div></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <div class="pagination-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="color:rgba(26,35,50,0.3); font-size:11px;">每页</span>
                    <select id="pageSizeSelect" class="page-size-select">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                    <span style="color:rgba(26,35,50,0.3); font-size:11px;">条</span>
                </div>
                <div class="pagination-controls">
                    <button id="prevPageBtn" class="btn btn-secondary btn-sm" disabled>◀</button>
                    <span id="pageInfo" class="page-info">第 1 / 1 页</span>
                    <button id="nextPageBtn" class="btn btn-secondary btn-sm" disabled>▶</button>
                </div>
                <div>
                    <span id="recordInfo" class="record-info">共 0 条</span>
                </div>
            </div>
        </div>

        <!-- ===== 登录记录 ===== -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">📊</span> 登录记录
                    <span style="font-size:11px; font-weight:400; color:rgba(26,35,50,0.3);" id="loginCount">(0 条)</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-secondary btn-sm" onclick="refreshLogins()">🔄 刷新</button>
                    <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📥 导出 CSV</button>
                </div>
            </div>

            <!-- 筛选 -->
            <div class="filter-bar">
                <div class="filter-item">
                    <label>👤 用户</label>
                    <input type="text" id="loginFilterName" placeholder="搜索..." autocomplete="off">
                </div>
                <div class="filter-item">
                    <label>🔑 邀请码</label>
                    <input type="text" id="loginFilterCode" placeholder="搜索..." autocomplete="off">
                </div>
                <div class="filter-item" style="min-width:200px;">
                    <label>📅 日期范围</label>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <input type="date" id="loginStartDate" style="flex:1;">
                        <span style="color:rgba(26,35,50,0.2);">—</span>
                        <input type="date" id="loginEndDate" style="flex:1;">
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary btn-sm" id="loginSearchBtn">🔍 搜索</button>
                    <button class="btn btn-secondary btn-sm" id="loginClearFilterBtn">🗑️ 清空</button>
                </div>
            </div>

            <!-- 表格 -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:50px;">ID</th>
                            <th>用户</th>
                            <th>邀请码</th>
                            <th style="width:160px;">登录时间</th>
                            <th style="width:120px;">IP</th>
                            <th>设备</th>
                        </tr>
                    </thead>
                    <tbody id="loginTableBody">
                        <tr><td colspan="6" class="empty-state"><div class="icon">📭</div><div class="text">暂无登录记录</div></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <div class="pagination-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="color:rgba(26,35,50,0.3); font-size:11px;">每页</span>
                    <select id="loginPageSizeSelect" class="page-size-select">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                    <span style="color:rgba(26,35,50,0.3); font-size:11px;">条</span>
                </div>
                <div class="pagination-controls">
                    <button id="loginPrevPageBtn" class="btn btn-secondary btn-sm" disabled>◀</button>
                    <span id="loginPageInfo" class="page-info">第 1 / 1 页</span>
                    <button id="loginNextPageBtn" class="btn btn-secondary btn-sm" disabled>▶</button>
                </div>
                <div>
                    <span id="loginRecordInfo" class="record-info">共 0 条</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  配置
        // ============================================================
        const API_BASE = ''; // 空 = 同域，或 'http://localhost:3000'

        // ============================================================
        //  工具函数
        // ============================================================
        function showLoading(show, text = '加载中...') {
            let el = document.getElementById('loadingOverlay');
            if (show) {
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'loadingOverlay';
                    el.className = 'loading-overlay';
                    el.innerHTML = `<div class="spinner"></div><div style="color:#1a2332;font-size:13px;">${text}</div>`;
                    document.body.appendChild(el);
                } else {
                    el.querySelector('div:last-child').textContent = text;
                    el.style.display = 'flex';
                }
            } else {
                if (el) el.style.display = 'none';
            }
        }

        function showToast(msg, isError = false) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.className = `toast${isError ? ' error' : ''}`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g,
                '&#39;');
        }

        function formatDate(d) {
            if (!d) return '-';
            try { return new Date(d).toLocaleString('zh-CN'); } catch (e) { return '-'; }
        }

        function getDomain() { return window.location.origin; }

        function generateCode(name, douyinId) {
            const clean = name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
            const suffix = Math.random().toString(36).substring(2, 8);
            let prefix = '';
            if (douyinId && douyinId.trim()) {
                prefix = douyinId.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            } else {
                prefix = clean.substring(0, 4).toLowerCase();
            }
            if (!prefix) prefix = 'friend';
            return `${prefix}_${suffix}`;
        }

        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text)
                .then(() => showToast(`✅ ${label}已复制`))
                .catch(() => showToast('复制失败', true));
        }

        // ============================================================
        //  状态
        // ============================================================
        let invitePage = 1,
            invitePageSize = 20,
            inviteTotal = 0,
            inviteTotalPages = 1;
        let inviteFilterName = '',
            inviteFilterStatus = 'all';

        let loginPage = 1,
            loginPageSize = 20,
            loginTotal = 0,
            loginTotalPages = 1;
        let loginFilterName = '',
            loginFilterCode = '',
            loginStartDate = '',
            loginEndDate = '';

        let currentPreviewCode = null;

        // ============================================================
        //  更新最后更新时间
        // ============================================================
        function updateLastUpdateTime() {
            document.getElementById('lastUpdateTime').textContent = '最后更新: ' + new Date().toLocaleString('zh-CN');
        }

        // ============================================================
        //  API 调用
        // ============================================================
        async function apiFetch(path, options = {}) {
            const url = `${API_BASE}${path}`;
            const res = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
            });
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`HTTP ${res.status}: ${text.substring(0, 100)}`);
            }
            return res.json();
        }

        // ============================================================
        //  统计卡片
        // ============================================================
        async function loadStats() {
            try {
                const inviteStats = await apiFetch('/api/get-stats');
                if (inviteStats.success) {
                    document.getElementById('statTotal').textContent = inviteStats.total || 0;
                    document.getElementById('statUsed').textContent = inviteStats.used || 0;
                    document.getElementById('statUnused').textContent = inviteStats.unused || 0;
                }

                const loginStats = await apiFetch('/api/login-stats');
                if (loginStats.success) {
                    document.getElementById('statTotalLogin').textContent = loginStats.data.totalLogins || 0;
                    document.getElementById('statTodayLogin').textContent = loginStats.data.todayLogins || 0;
                }
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        // ============================================================
        //  趋势图
        // ============================================================
        async function loadTrend() {
            try {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - 6);
                const params = new URLSearchParams();
                params.append('startDate', start.toISOString().split('T')[0]);
                params.append('endDate', end.toISOString().split('T')[0]);
                params.append('pageSize', '100');

                const res = await apiFetch(`/api/login-logs?${params}`);
                if (!res.success || !res.data) {
                    document.getElementById('trendChart').innerHTML =
                        '<div style="width:100%;text-align:center;color:rgba(26,35,50,0.3);padding:30px 0;font-size:13px;">暂无数据</div>';
                    return;
                }

                const days = {};
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - (6 - i));
                    const key = d.toISOString().split('T')[0];
                    days[key] = { date: d, count: 0, label: (d.getMonth() + 1) + '/' + d.getDate() };
                }

                res.data.forEach(item => {
                    if (item.login_time) {
                        const key = new Date(item.login_time).toISOString().split('T')[0];
                        if (days[key]) days[key].count++;
                    }
                });

                const values = Object.values(days);
                const max = Math.max(...values.map(v => v.count), 1);

                let html = '';
                values.forEach(v => {
                    const pct = Math.max(4, (v.count / max) * 100);
                    const color = v.count === 0 ? 'rgba(0,0,0,0.06)' :
                        v.count === max ? 'linear-gradient(180deg, #c9940a, #e8456b)' :
                        'linear-gradient(180deg, #e8456b, #ff6b35)';
                    html += `
                        <div class="trend-bar-wrapper">
                            <div class="trend-bar" style="height:${pct}%;background:${color};"></div>
                            <div class="trend-bar-label">${v.label}<br><span class="count">${v.count}</span></div>
                        </div>
                    `;
                });

                document.getElementById('trendChart').innerHTML = html;
                document.getElementById('trendSubtitle').textContent =
                    `${start.toLocaleDateString('zh-CN')} ~ ${end.toLocaleDateString('zh-CN')}`;

            } catch (e) {
                console.error('加载趋势失败:', e);
                document.getElementById('trendChart').innerHTML =
                    '<div style="width:100%;text-align:center;color:rgba(26,35,50,0.3);padding:30px 0;font-size:13px;">加载失败</div>';
            }
        }

        // ============================================================
        //  邀请码列表
        // ============================================================
        function buildInviteParams() {
            const p = new URLSearchParams();
            p.append('page', invitePage);
            p.append('pageSize', invitePageSize);
            if (inviteFilterName.trim()) p.append('name', inviteFilterName.trim());
            if (inviteFilterStatus !== 'all') p.append('used', inviteFilterStatus === 'used' ? 'true' : 'false');
            return p.toString();
        }

        function renderInvites(data) {
            const tbody = document.getElementById('inviteTableBody');
            if (!data || data.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="7" class="empty-state"><div class="icon">📭</div><div class="text">暂无数据</div></td></tr>`;
                document.getElementById('inviteCount').textContent = '(0 条)';
                return;
            }
            let html = '';
            const domain = getDomain();
            data.forEach(item => {
                const link = `${domain}/login.html?code=${encodeURIComponent(item.code)}`;
                // 状态标签 - 使用更清晰的设计
                const statusHtml = item.used
                    ? `<span class="status-badge status-used"><span class="dot"></span>已使用</span>`
                    : `<span class="status-badge status-unused"><span class="dot"></span>未使用</span>`;

                html += `
                    <tr>
                        <td>${item.id}</td>
                        <td style="font-weight:500;">${escapeHtml(item.name)}</td>
                        <td><span class="code-cell">${escapeHtml(item.code)}</span></td>
                        <td>${statusHtml}</td>
                        <td style="font-size:11px;">${formatDate(item.created_at)}</td>
                        <td style="font-size:11px;">${formatDate(item.used_at)}</td>
                        <td>
                            <div class="action-group">
                                <button class="btn btn-secondary btn-xs" onclick="copyToClipboard('${escapeHtml(link)}','链接')">📋</button>
                                <button class="btn btn-secondary btn-xs" onclick="copyToClipboard('${escapeHtml(item.code)}','邀请码')">🔑</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteInvite(${item.id},'${escapeHtml(item.code)}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            document.getElementById('inviteCount').textContent = `(${inviteTotal} 条)`;
        }

        function updateInvitePagination() {
            document.getElementById('pageInfo').textContent = `第 ${invitePage} / ${inviteTotalPages || 1} 页`;
            document.getElementById('recordInfo').textContent = `共 ${inviteTotal} 条`;
            document.getElementById('prevPageBtn').disabled = invitePage <= 1;
            document.getElementById('nextPageBtn').disabled = invitePage >= inviteTotalPages || inviteTotalPages === 0;
        }

        async function loadInvites() {
            showLoading(true, '加载邀请码...');
            try {
                const res = await apiFetch(`/api/get-invites?${buildInviteParams()}`);
                if (res.success) {
                    renderInvites(res.data);
                    inviteTotal = res.total;
                    inviteTotalPages = res.totalPages;
                    updateInvitePagination();
                } else {
                    showToast(res.message || '加载失败', true);
                    renderInvites([]);
                }
            } catch (e) {
                showToast('网络错误', true);
                renderInvites([]);
            } finally {
                showLoading(false);
            }
        }

        function refreshInvites() { loadInvites(); }

        // ============================================================
        //  生成邀请码
        // ============================================================
        function updatePreview() {
            const name = document.getElementById('friendName').value.trim();
            const douyinId = document.getElementById('douyinId').value.trim();
            const box = document.getElementById('previewBox');
            if (name) {
                const code = generateCode(name, douyinId);
                currentPreviewCode = code;
                const link = `${getDomain()}/login.html?code=${encodeURIComponent(code)}`;
                document.getElementById('previewCode').textContent = code;
                document.getElementById('previewLink').textContent = link;
                box.classList.add('show');
            } else {
                box.classList.remove('show');
                currentPreviewCode = null;
            }
        }

        function copyPreviewLink() {
            const link = document.getElementById('previewLink').textContent;
            if (link && link !== '--') copyToClipboard(link, '链接');
        }

        async function saveInvite() {
            const name = document.getElementById('friendName').value.trim();
            const douyinId = document.getElementById('douyinId').value.trim();
            if (!name) { showToast('请输入好友名称', true); return; }
            const code = generateCode(name, douyinId);
            showLoading(true, '入库中...');
            try {
                const res = await apiFetch('/api/add-invite', {
                    method: 'POST',
                    body: JSON.stringify({ code, name })
                });
                if (res.success) {
                    showToast(`✅ ${code} 已入库`);
                    document.getElementById('friendName').value = '';
                    document.getElementById('douyinId').value = '';
                    document.getElementById('previewBox').classList.remove('show');
                    refreshAll();
                } else {
                    showToast(res.message || '入库失败', true);
                }
            } catch (e) {
                showToast('网络错误', true);
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        //  删除邀请码
        // ============================================================
        async function deleteInvite(id, code) {
            if (!confirm(`确定删除 "${code}" 吗？`)) return;
            showLoading(true, '删除中...');
            try {
                const res = await apiFetch('/api/delete-invite', {
                    method: 'POST',
                    body: JSON.stringify({ id })
                });
                if (res.success) {
                    showToast(`✅ 已删除 ${code}`);
                    refreshAll();
                } else {
                    showToast(res.message || '删除失败', true);
                }
            } catch (e) {
                showToast('网络错误', true);
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        //  登录记录
        // ============================================================
        function buildLoginParams() {
            const p = new URLSearchParams();
            p.append('page', loginPage);
            p.append('pageSize', loginPageSize);
            if (loginFilterName.trim()) p.append('userName', loginFilterName.trim());
            if (loginFilterCode.trim()) p.append('inviteCode', loginFilterCode.trim());
            if (loginStartDate) p.append('startDate', loginStartDate);
            if (loginEndDate) p.append('endDate', loginEndDate);
            return p.toString();
        }

        function renderLogins(data) {
            const tbody = document.getElementById('loginTableBody');
            if (!data || data.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" class="empty-state"><div class="icon">📭</div><div class="text">暂无登录记录</div></td></tr>`;
                document.getElementById('loginCount').textContent = '(0 条)';
                return;
            }
            let html = '';
            data.forEach(item => {
                html += `
                    <tr>
                        <td>${item.id}</td>
                        <td style="font-weight:500;">${escapeHtml(item.user_name)}</td>
                        <td><span class="code-cell">${escapeHtml(item.invite_code)}</span></td>
                        <td style="font-size:11px;">${formatDate(item.login_time)}</td>
                        <td style="font-size:11px;">${escapeHtml(item.ip_address || '-')}</td>
                        <td style="font-size:10px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(item.user_agent || '')}">${escapeHtml((item.user_agent || '-').substring(0, 40))}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            document.getElementById('loginCount').textContent = `(${loginTotal} 条)`;
        }

        function updateLoginPagination() {
            document.getElementById('loginPageInfo').textContent = `第 ${loginPage} / ${loginTotalPages || 1} 页`;
            document.getElementById('loginRecordInfo').textContent = `共 ${loginTotal} 条`;
            document.getElementById('loginPrevPageBtn').disabled = loginPage <= 1;
            document.getElementById('loginNextPageBtn').disabled = loginPage >= loginTotalPages || loginTotalPages === 0;
        }

        async function loadLogins() {
            showLoading(true, '加载登录记录...');
            try {
                const res = await apiFetch(`/api/login-logs?${buildLoginParams()}`);
                if (res.success) {
                    renderLogins(res.data);
                    loginTotal = res.total;
                    loginTotalPages = res.totalPages;
                    updateLoginPagination();
                } else {
                    showToast(res.message || '加载失败', true);
                    renderLogins([]);
                }
            } catch (e) {
                showToast('网络错误', true);
                renderLogins([]);
            } finally {
                showLoading(false);
            }
        }

        function refreshLogins() { loadLogins(); }

        // ============================================================
        //  导出 CSV
        // ============================================================
        async function exportCSV() {
            showLoading(true, '导出中...');
            try {
                const url = `${API_BASE}/api/export-logs`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('导出失败');
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `登录记录_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                showToast('✅ 导出成功');
            } catch (e) {
                showToast('导出失败', true);
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        //  刷新全部
        // ============================================================
        function refreshAll() {
            loadStats();
            loadTrend();
            loadInvites();
            loadLogins();
            updateLastUpdateTime();
            showToast('🔄 已刷新');
        }

        // ============================================================
        //  绑定事件
        // ============================================================
        function bindEvents() {
            document.getElementById('saveToDbBtn').addEventListener('click', saveInvite);
            document.getElementById('friendName').addEventListener('input', updatePreview);
            document.getElementById('douyinId').addEventListener('input', updatePreview);

            document.getElementById('searchBtn').addEventListener('click', () => {
                inviteFilterName = document.getElementById('filterName').value;
                inviteFilterStatus = document.getElementById('filterStatus').value;
                invitePage = 1;
                loadInvites();
            });
            document.getElementById('clearFilterBtn').addEventListener('click', () => {
                document.getElementById('filterName').value = '';
                document.getElementById('filterStatus').value = 'all';
                inviteFilterName = '';
                inviteFilterStatus = 'all';
                invitePage = 1;
                loadInvites();
                showToast('已清空筛选');
            });
            document.getElementById('filterName').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inviteFilterName = document.getElementById('filterName').value;
                    inviteFilterStatus = document.getElementById('filterStatus').value;
                    invitePage = 1;
                    loadInvites();
                }
            });

            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (invitePage > 1) { invitePage--;
                    loadInvites(); }
            });
            document.getElementById('nextPageBtn').addEventListener('click', () => {
                if (invitePage < inviteTotalPages) { invitePage++;
                    loadInvites(); }
            });
            document.getElementById('pageSizeSelect').addEventListener('change', function() {
                invitePageSize = parseInt(this.value);
                invitePage = 1;
                loadInvites();
            });

            document.getElementById('loginSearchBtn').addEventListener('click', () => {
                loginFilterName = document.getElementById('loginFilterName').value;
                loginFilterCode = document.getElementById('loginFilterCode').value;
                loginStartDate = document.getElementById('loginStartDate').value;
                loginEndDate = document.getElementById('loginEndDate').value;
                loginPage = 1;
                loadLogins();
            });
            document.getElementById('loginClearFilterBtn').addEventListener('click', () => {
                document.getElementById('loginFilterName').value = '';
                document.getElementById('loginFilterCode').value = '';
                document.getElementById('loginStartDate').value = '';
                document.getElementById('loginEndDate').value = '';
                loginFilterName = '';
                loginFilterCode = '';
                loginStartDate = '';
                loginEndDate = '';
                loginPage = 1;
                loadLogins();
                showToast('已清空筛选');
            });

            document.getElementById('loginPrevPageBtn').addEventListener('click', () => {
                if (loginPage > 1) { loginPage--;
                    loadLogins(); }
            });
            document.getElementById('loginNextPageBtn').addEventListener('click', () => {
                if (loginPage < loginTotalPages) { loginPage++;
                    loadLogins(); }
            });
            document.getElementById('loginPageSizeSelect').addEventListener('change', function() {
                loginPageSize = parseInt(this.value);
                loginPage = 1;
                loadLogins();
            });

            document.getElementById('loginFilterName').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginFilterName = document.getElementById('loginFilterName').value;
                    loginFilterCode = document.getElementById('loginFilterCode').value;
                    loginStartDate = document.getElementById('loginStartDate').value;
                    loginEndDate = document.getElementById('loginEndDate').value;
                    loginPage = 1;
                    loadLogins();
                }
            });
            document.getElementById('loginFilterCode').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginFilterName = document.getElementById('loginFilterName').value;
                    loginFilterCode = document.getElementById('loginFilterCode').value;
                    loginStartDate = document.getElementById('loginStartDate').value;
                    loginEndDate = document.getElementById('loginEndDate').value;
                    loginPage = 1;
                    loadLogins();
                }
            });

            document.getElementById('loginStartDate').addEventListener('change', () => {
                loginStartDate = document.getElementById('loginStartDate').value;
                loginPage = 1;
                loadLogins();
            });
            document.getElementById('loginEndDate').addEventListener('change', () => {
                loginEndDate = document.getElementById('loginEndDate').value;
                loginPage = 1;
                loadLogins();
            });
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 6);
            document.getElementById('loginStartDate').value = start.toISOString().split('T')[0];
            document.getElementById('loginEndDate').value = end.toISOString().split('T')[0];
            loginStartDate = document.getElementById('loginStartDate').value;
            loginEndDate = document.getElementById('loginEndDate').value;

            bindEvents();
            refreshAll();

            window.copyToClipboard = copyToClipboard;
            window.deleteInvite = deleteInvite;
            window.refreshAll = refreshAll;
            window.exportCSV = exportCSV;
            window.refreshInvites = refreshInvites;
            window.refreshLogins = refreshLogins;
            window.copyPreviewLink = copyPreviewLink;
        });
    </script>
</body>
</html>
